<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Ranker Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4B0082, #6A0DAD);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .dashboard-container {
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        .charts-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }

        .chart-container {
            flex: 1;
            min-width: 300px;
            max-width: 32%;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: 180px;
            background: white;
            border-radius: 10px;
            padding: 5px;
        }

        h3 {
            font-weight: 600;
            margin-bottom: 15px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h2><i class="fas fa-file-circle-check"></i> Resume Ranker</h2>

        <form action="/" method="post" enctype="multipart/form-data" class="mt-4">
            <div class="mb-3">
                <label for="job_description">
                    <i class="fas fa-briefcase"></i> Job Description
                </label>
                <textarea class="form-control" id="job_description" name="job_description" rows="4" required></textarea>
            </div>
            
            <div class="mb-3">
                <label for="resumes">
                    <i class="fas fa-file-arrow-up"></i> Upload Resumes (PDF only)
                </label>
                <input type="file" id="resumes" name="resumes" multiple accept=".pdf" required class="form-control">
            </div>
            
            <button type="submit" class="btn btn-success w-100">
                <i class="fas fa-sort"></i> Rank Resumes
            </button>
        </form>

        {% if ranked_resumes %}
        <div class="table-container">
            <h3><i class="fas fa-trophy"></i> Ranked Resumes</h3>
            <table class="table table-bordered mt-3 text-white">
                <thead class="table-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Resume Name</th>
                        <th>Match Score (%)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for resume in ranked_resumes %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ resume[0] }}</td>
                        <td>{{ resume[1] }}%</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Charts Row (Horizontal Display) -->
        <div class="charts-row">
            <div class="chart-container">
                <h3><i class="fas fa-chart-pie"></i> Match Distribution</h3>
                <canvas id="rankingPieChart"></canvas>
            </div>

            <div class="chart-container">
                <h3><i class="fas fa-chart-bar"></i> Resume vs Job Description</h3>
                <canvas id="rankingBarChart"></canvas>
            </div>

            <div class="chart-container">
                <h3><i class="fas fa-chart-line"></i> Matching Trend</h3>
                <canvas id="rankingLineChart"></canvas>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                try {
                    let rankedResumes = JSON.parse('{{ ranked_resumes | tojson | safe }}');
                    
                    if (!Array.isArray(rankedResumes) || rankedResumes.length === 0) {
                        console.warn("No ranked resumes available.");
                        return;
                    }

                    let labels = rankedResumes.map(resume => resume[0]);
                    let scores = rankedResumes.map(resume => parseFloat(resume[1]));

                    // Pie Chart
                    let pieLabels = ['Match Score (%)', 'Remaining (%)'];
                    let pieData = [scores[0], 100 - scores[0]];

                    new Chart(document.getElementById('rankingPieChart'), {
                        type: 'pie',
                        data: {
                            labels: pieLabels,
                            datasets: [{
                                label: 'Match Percentage',
                                data: pieData,
                                backgroundColor: ['#FF5733', '#D3D3D3'], 
                            }]
                        }
                    });

                    // Bar Chart
                    new Chart(document.getElementById('rankingBarChart'), {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Match with Job Description (%)',
                                data: scores,
                                backgroundColor: '#1E90FF',
                                borderWidth: 2
                            }]
                        }
                    });

                    // Line Chart (No Trend Line, Fixed Y-Axis 0-100)
                    new Chart(document.getElementById('rankingLineChart'), {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Matching Trend (%)',
                                data: scores,
                                borderColor: '#FFD700',
                                borderWidth: 3,
                                pointBackgroundColor: '#FFD700',
                                fill: false,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100
                                }
                            }
                        }
                    });

                } catch (error) {
                    console.error("Error parsing ranked resumes data:", error);
                }
            });
        </script>
        {% endif %}
    </div>
</body>
</html>
